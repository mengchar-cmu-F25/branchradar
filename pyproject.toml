[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "branchradar"
version = "0.1.0"
description = "Flag path-level coordination risks across Git worktrees"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mengchao Ren" }]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/mengchar-cmu-F25/branchradar"
Issues = "https://github.com/mengchar-cmu-F25/branchradar/issues"

[project.scripts]
branchradar = "branchradar:main"

[tool.setuptools]
py-modules = ["branchradar"]
